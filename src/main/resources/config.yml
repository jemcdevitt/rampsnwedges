# Ramps and wedges

debug: true
regen-resource-pack: false

# Physical implementation blocks.
#
# ramp-stair is sacrificed as the invisible collision/placement carrier for
# all ramps while the generated resource pack is active. Its normal crafting
# recipes are removed by the plugin.
#
# wedge-block is used after a wedge or hip is placed. BARRIER is recommended:
# it is invisible, has full-block collision, has no normal recipe, and does
# not cause adjacent solid block faces to be culled.
carrier:
  ramp-stair: RED_SANDSTONE_STAIRS
  wedge-block: BARRIER

# Every ordinary block listed here can be converted in the stonecutter into
# one ramp, four wedge orientations and four hip orientations. The same material
# supplies the visible texture and its hardness/tool behavior when mined in Survival.
#
# The default generated model assumes minecraft:block/<material-name> is a
# suitable single texture. Blocks with specialized multi-face textures may
# render imperfectly; those can be handled with overrides in a future version.
materials:
  - "#PLANKS"
  - "#LOGS"
  - "#WOOL"
  - "#TERRACOTTA"
  - "#BAMBOO_BLOCKS"
  - "#CONCRETE"
  - "#COPPER"
  - "#MUD"
  - EMERALD_BLOCK
  - GOLD_BLOCK
  - REDSTONE_BLOCK
  - STONE
  - COBBLESTONE
  - ANDESITE
  - POLISHED_ANDESITE
  - DIORITE
  - POLISHED_DIORITE
  - GRANITE
  - POLISHED_GRANITE
  - DEEPSLATE
  - CHISELED_DEEPSLATE
  - COBBLED_DEEPSLATE
  - POLISHED_DEEPSLATE
  - DEEPSLATE_BRICKS
  - CRACKED_DEEPSLATE_BRICKS
  - DEEPSLATE_TILES
  - CRACKED_DEEPSLATE_TILES
  - TUFF
  - CHISELED_TUFF
  - POLISHED_TUFF
  - TUFF_BRICKS
  - BRICKS
  - PACKED_MUD
  - MUD_BRICKS
  - RESIN_BRICKS
  - CHISELED_RESIN_BRICKS
  - RED_SANDSTONE
  - CHISELED_RED_SANDSTONE
