# Many minecraft blocks do not use textures that are named for them
# they use other textures or parts of other textures.  For example,
# smooth_red_sandtone uses the texture red_sandstone_top on all sides.
#
# This file will provide a mapping for only those blocks that don't
# match their names or follow common patterns like all _wood blocks use
# their _log texture.
#
# This map will be checked first before creating the texture name
# from the block and if a mapping is found this will be used

mapped-textures: 
    crimson_hyphae : crimson_stem
    muddy_mangrove_roots : muddy_mangrove_roots_side
    smooth_red_sandstone : red_sandstone_top
    smooth_sandstone : sandstone_top
    stripped_crimson_hyphae : stripped_crimson_stem
    stripped_warped_hyphae : stripped_warped_stem
    warped_hyphae : warped_stem
    waxed_copper_block : copper_block
    waxed_exposed_copper : exposed_copper
    waxed_oxidized_copper : oxidized_copper
    waxed_weathered_copper : weathered_copper
  
